# Research topics. Text follows the Notion CELOS Lab page (Research Topics), 2026-10-24.
# Markup: **bold**, __underline__ (see src/lib/emph.ts). summaryKo is shown under the "Kor." toggle.
# media: file name (without extension) under public/media/ (.mp4 + .webp poster)
- id: optimal-control
  order: 1
  title: Sampling-based optimal control for autonomous driving/robots
  summary: Our lab conducts research on **__optimal control-based autonomous mobility__**. We utilize optimal control to __achieve multiple objectives under uncertainty__.
  summaryKo: 우리 연구실은 **__최적제어 기반 자율 모빌리티__**를 연구합니다. 최적제어를 통해 __불확실함 속에서 여러 목표를 달성__합니다.
  demos:
    - { media: ad_outdoor, caption: "Stochastic MPC for outdoor autonomous driving & collision avoidance" }
    - { media: ad_indoor, caption: "Indoor autonomous driving using sampling-based MPC" }
    - { media: mppi_superquadric, caption: "Precise collision avoidance using superquadric potential function" }
    # formation clip withheld: the source GIF shows a personal email watermark (decision pending)
- id: reinforcement-learning
  order: 2
  title: Reinforcement learning and digital twin for autonomous systems in complex environments
  summary: Our lab conducts research on **__reinforcement learning-based optimal control__**. We transfer real-world robots and mobile platforms into simulated environments to __enable autonomous operation even in complex terrains and obstacle-rich scenarios__.
  summaryKo: 우리 연구실은 **__강화학습과 디지털트윈__**을 연구합니다. 현실세계의 로봇과 모바일을 시뮬레이션 world에 옮기고, __복잡한 지형이나 장애물이 많은 상황에서도 자율적으로 움직일 수 있도록__ 반복적으로 강화학습을 적용합니다.
  demos:
    - { media: wlr_iros2025, caption: "Wheeled-legged robot control using RL (Winner, WLR workshop competition, IROS 2025)" }
    - { media: spider, caption: "Spider robot control in rough terrain (Diden Robotics)" }
    - { media: mobile_manipulator, caption: "Mobile manipulator control" }
- id: state-estimation
  order: 3
  title: State estimation using various sensors under uncertainty
  summary: Our lab develops methods to **__estimate the motion of vehicles and robots under uncertainty__**. We utilize sensors such as __LiDAR, radar, cameras, GPS, and IMU__, and incorporate various techniques __to handle the measurement uncertainties__ inherent in these sensors.
  summaryKo: 우리 연구실은 **__불확실성 속에서 차량과 로봇의 움직임을 추정__**하기 위한 방법을 연구합니다. 이를 위해 __라이다, 레이다, 카메라, GPS, IMU 센서를 활용__하며, 센서에 존재하는 __측정 불확실성을 다루기 위해__ 다양한 기법을 도입합니다.
  demos:
    - { media: mot, caption: "Multi-object tracking using 4D radar and LiDAR" }
    - { media: ekf, caption: "Bias-removed EKF for robust pose estimation" }
